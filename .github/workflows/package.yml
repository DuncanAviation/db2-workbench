name: Package

# Builds one .vsix per platform. odbc is a native module, so a package only runs on the OS and
# architecture it was installed on: each target builds on a runner of its own kind, and the
# --target flag tells the Marketplace which platform each .vsix serves. release.yml calls this workflow
# to build the packages it publishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      pre-release:
        description: Package for the Marketplace's pre-release channel.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          target: win32-x64
        - os: ubuntu-latest
          target: linux-x64
    runs-on: ${{ matrix.os }}
    steps: &package-steps
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        # Same Node CONTRIBUTING.md asks developers to use.
        node-version: '22.17.0'
        cache: npm

    # odbc downloads a prebuilt binary when IBM publishes one for the platform, and otherwise
    # compiles from source against unixODBC's headers. Installing them either way keeps a missing
    # prebuilt from failing the build. On macOS, odbc's binding.gyp links against Homebrew's default
    # prefix (/opt/homebrew on arm64, /usr/local on x64), which is where the runners have it.
    - name: Install unixODBC (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y unixodbc-dev

    - name: Install unixODBC (macOS)
      if: runner.os == 'macOS'
      run: brew install unixodbc

    - run: npm ci

    # vsce runs vscode:prepublish (compile plus the production webview bundles) before packaging.
    # Builds that aren't releases (pushes, pull requests) have no inputs and package as pre-release,
    # like npm run build-exe does locally; only a stable release passes pre-release: false.
    - name: Package
      shell: bash
      run: |
        channel=--pre-release
        if [ "${{ inputs.pre-release }}" = "false" ]; then channel=; fi
        npx vsce package $channel --target ${{ matrix.target }}

    - uses: actions/upload-artifact@v4
      with:
        name: db2-workbench-${{ matrix.target }}
        path: '*.vsix'
        if-no-files-found: error

  # GitHub's hosted macOS runners are often short of capacity, and a job that never gets one is
  # cancelled after about 15 minutes. So the macOS packages are only built where they're needed: for a
  # release (release.yml runs this workflow for a v* tag, and github.ref is the caller's), or on a manual
  # run. A release whose macOS job wasn't picked up can rerun just that job.
  package-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          target: darwin-arm64
        - os: macos-15-intel
          target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps: *package-steps
